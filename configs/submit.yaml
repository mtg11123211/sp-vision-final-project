enemy_color: "red"
# enemy_color: "blue"
rotation_angle: 0

#####-----神经网络参数-----#####
yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.88
use_traditional: true
roi:
  x: 304
  y: 152
  width: 800
  height: 800
use_roi: true
threshold: 100

# yaw_offset / pitch_offset：加在 calc_aim 算出的世界系绝对角上的固定角偏置（单位：度）。
# 它们只该补「不随距离变的固定角偏差」——电控 pitch 零位、相机安装角这类。
# 历史值 2 / 6.5 / 10.24 都是“验证这两个变量有没有生效”时随手写的探针值，不是标定结果，
# 所以基准一律取 0；真要有偏差，用 3 发静止靶量出来再写，别凭感觉填。
# 现场临时试验可以用环境变量覆盖，不用改这里：
#   DSH_YAW_OFFSET=0.3 DSH_PITCH_OFFSET=-1.2 ./build/task_2 configs/standard.yaml
yaw_offset: 0.0
pitch_offset: 0.5   # 10-23 现场：弹着偏低 10-15 mm，0.5° 在 3 m ≈ 26 mm（与 standard.yaml 一致）

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1343px
camera_matrix: [1809.234195387095, 0, 704.31187942650604, 0, 1813.0102441212994, 551.84741058200325, 0, 0, 1]
distort_coeffs: [-0.077198727509676837, 0.15037874517911318, 0.0015735581437855061, 0.001040223876430159, 0]

# 相机同理想情况的偏角: yaw0.45 pitch-3.00 roll0.09 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw-113.55 pitch13.12 roll0.32 degree
R_camera2gimbal: [-0.0080131954294522384, -0.052394960826908567, 0.9985942903797097, -0.99996668029748925, 0.001975655200289353, -0.0079205480459238874, -0.0015578811981739912, -0.99862448641442592, -0.052409046353621917]
t_camera2gimbal: [0.041545038711890976, 0.002043263447746746, 0.092648548907388106]

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----任务二、任务三共用参数-----#####
# 电控上报的弹速不可用（小于 5 米每秒）时的兜底值，必须在日志里告警一次
default_bullet_speed: 25.0
# 弹道解算用：摩擦轮出弹点到 pitch 轴的枪管方向距离，单位米
muzzle_offset_x: 0.171
# 目标短暂丢失后继续用预测值接管云台的时间，单位毫秒
target_hold_ms: 300
# NIS 拒收门限：4 自由度卡方分布的 99.7% 分位是 16.27，超过就丢弃这一帧观测
# （4 自由度下 95% 分位是 9.488、99% 是 13.28、99.9% 是 18.47，可以按需加减）
nis_reject_threshold: 16.27
# 滤波器建立后至少跑多少帧才允许开火（真正的收敛判据之一）
# 15 帧 = 58 fps 下 0.26 秒；开着录包会掉到 45 fps，就变成 0.33 秒，白丢 1-2 发。
# 10 帧 = 0.17-0.22 秒，够滤波收敛，又不会把第一发拖太久。
min_frames_for_fire: 10
# recent_nis_failures 低于这个值才认为滤波器健康
max_nis_failure_rate: 0.3

#####-----任务二（中低速小陀螺，弹频 5 赫兹、每个转速只许 10 发）-----#####
task2:
  fire_interval_s: 0.2         # 开火节流：>=0.2 s，即 5 赫兹（赛规给的就是 5 Hz，照抄最稳）
                               # 防「同一块板连吃两发」不靠这个值，靠 plate_armed：
                               # 打完一发要摆出 DSH_PLATE_REARM_DEG(35°) 或换板才重新上膛，
                               # 0.2 s 时板子只转过 46°，摆出角度前 facing 已经出窗口了。
  max_rounds_per_stage: 10     # 提交版：任务二每个转速挡只打 10 发（赛规）；standard.yaml 是 0（不限）
  # 转速挡位切换的判定窗口：超过这个时间没有新弹丸，且拟合角速度换了挡，
  # 就认为一个转速挡位结束、重新开始计数；超过 3 倍这个时间则一律重新计数。
  stage_gap_s: 5.0
  # 低转速与中转速的分界，要求里写的是 5 弧度每秒
  speed_band_split: 5.0
  # 是否要求云台处于自瞄挡位才接管控制。
  # 现场日志已连续确认 `[dbg] 电控挡位 = AUTO_AIM(自瞄)`，所以置 true：
  # 电控被拨回手动时软件会主动交权、不再请求开火（否则会出现 rounds 一路涨、
  # 车上 bullet_count 一动不动的情况，白耗一整个挡位的额度）。
  # 如果场上电控挡位会抖，改回 false 才是保险的——代价是 IDLE 时也会空转请求。
  require_auto_aim_mode: true

#####-----任务三（前哨站，弹频 12 赫兹）-----#####
task3:
  fire_interval_s: 0.0834     # 12 赫兹
  max_rounds_per_stage: 0     # 0 表示不限发数（任务三按 30 秒计时）
  stage_gap_s: 3.0
  # 排除顶部装甲板的高度窗口：三块中部装甲板彼此高度差约 0.2 米，
  # 顶部装甲板在它们上方约 0.3 米，所以 0.30 米能把顶部板挡在外面。
  # 现场用 Plotter 打印三块板的 z 核对后再定稿。
  outpost_z_window: 0.30
  # 已有滤波器时，允许比三块预测板最高者再高多少米（再挡一次顶部板）
  outpost_top_margin: 0.12
  require_auto_aim_mode: false

#####-----录包与回放（离线拟真用；正式跑车时保持为空）-----#####
# 非空就把每一帧的图、曝光时刻、云台四元数、弹速写进这个目录。
# 也可以不改这里，用环境变量覆盖：DSH_RECORD_DIR=/路径 ./build/task_2 configs/standard.yaml
# 注意录包必须整机上电、电控在发数据（因为要录云台四元数）。
record_dir: ""
# 每隔多少帧存一张。1 = 每帧都存；2 = 隔帧存，体积减半
record_every: 1
# 存图的 JPEG 质量。95 大约每帧 250 到 400 KB；空间紧张就降到 85
record_jpeg_quality: 95
# 非空就从录包回放：图片序列当相机，录下来的四元数当云台，不打开串口。
# 同样可以用环境变量覆盖：DSH_REPLAY_DIR=/路径 ./build/task_2 configs/standard.yaml
replay_dir: ""
# 回放是否循环播放（建议开，方便一直盯着看）
replay_loop: true